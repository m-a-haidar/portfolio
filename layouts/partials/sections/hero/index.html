{{ if .Site.Params.hero.enable | default false }}
<section id="hero">
  <div class="container">
    <div class="hero-inner">
      <div class="hero-text {{ if .Site.Params.animate }}animate{{ end }}">
        <div class="hero-role">{{ .Site.Params.hero.subtitle }}</div>
        <h1 class="hero-name">{{ .Site.Params.hero.title }}</h1>
        <div class="hero-tag">{{ .Site.Params.hero.content | markdownify }}</div>
        <div class="hero-switchrow">
          <div>
            <p class="switch-label">View my work</p>
            <div class="seg" data-i="0" id="workSwitch" role="tablist" aria-label="Project type">
              <span class="thumb"></span>
              <button class="on" role="tab" aria-selected="true" data-i="0" data-panel="research">Research</button>
              <button role="tab" aria-selected="false" data-i="1" data-panel="data">Data Analysis</button>
            </div>
          </div>
          <button class="btn-profile" id="profileBtn" aria-expanded="false">&#9656; Profile / CV</button>
        </div>
      </div>
      <div class="hero-figure {{ if .Site.Params.animate }}animate{{ end }}">
        <img src="{{ .Site.Params.hero.image }}" alt="{{ .Site.Params.hero.title }}">
      </div>
    </div>
  </div>
</section>
{{ end }}
