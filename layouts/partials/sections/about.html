{{ if .Site.Params.about.enable | default false }}
<section id="about">
  <div class="container">
    <div class="about-grid">
      <div class="sec-label">{{ .Site.Params.about.title | default "About" }}</div>
      <div class="about-body">
        <div class="about-content">{{ .Site.Params.about.content | markdownify }}</div>
        {{ if .Site.Params.about.skills.enable }}
        <div class="chips">
          {{ range .Site.Params.about.skills.items }}<span class="chip">{{ . }}</span>{{ end }}
        </div>
        {{ end }}
      </div>
    </div>
  </div>
</section>
{{ end }}
