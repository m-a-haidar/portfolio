{{ if .Site.Params.contact.enable | default false }}
<section id="contact">
  <div class="container">
    <div class="sec-label contact-label">Contact</div>
    <h2 class="contact-head">Let&#39;s talk.</h2>
    <p class="contact-tag">{{ .Site.Params.contact.content | emojify | markdownify }}</p>
    <a class="btn btn-fill" href="{{ .Site.Params.contact.btnLink | default "#" }}">{{ .Site.Params.contact.btnName | default "Contact me" }}</a>
  </div>
</section>
{{ end }}
